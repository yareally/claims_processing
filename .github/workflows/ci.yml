name: CI

# Run on every pull request to main, and again after each merge.
# Do not add "paths" filters here. A required check whose workflow is skipped stays
# pending, and that blocks the pull request.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Give this workflow read access only, so a bad change cannot alter the repo.
permissions:
  contents: read

jobs:
  # The branch protection rule requires a check called "build-and-test".
  # Renaming this job means updating that rule too.
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build, treating warnings as errors
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Run tests
        run: dotnet test --no-build --configuration Release

      # This command exits with 0 even when it finds a problem, so search its output.
      - name: Check packages for known vulnerabilities
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
